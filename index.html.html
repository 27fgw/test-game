<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>네온 똥피하기 - 슬라임 에디션</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #0b0f19;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .font-game {
      font-family: 'Black Han Sans', sans-serif;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 100vh;
      max-height: 720px;
      background: #111827;
      border: 2px solid #3b82f6;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(59, 130, 246, 0.25);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .btn-arcade {
      transition: all 0.1s ease;
      box-shadow: 0 4px 0 #1d4ed8, 0 6px 12px rgba(0,0,0,0.4);
    }
    .btn-arcade:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #1d4ed8, 0 2px 4px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

<div id="game-container">
  <!-- 상단 스코어 / HUD -->
  <div class="absolute top-0 left-0 w-full p-4 flex justify-between items-center z-10 pointer-events-none">
    <div class="font-game text-xl text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">
      DODGE!
    </div>
    <div class="flex gap-2 font-game text-sm">
      <div class="bg-slate-800/90 border border-slate-700 px-3 py-1 rounded-lg">
        <span class="text-slate-400">BEST:</span>
        <span id="highScoreText" class="text-yellow-400 ml-1">0</span>
      </div>
      <div class="bg-slate-800/90 border border-slate-700 px-3 py-1 rounded-lg">
        <span class="text-slate-400">SCORE:</span>
        <span id="scoreText" class="text-cyan-400 ml-1">0</span>
      </div>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <!-- 시작 화면 -->
  <div id="startScreen" class="absolute inset-0 bg-slate-950/90 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center z-20">
    <div class="text-6xl mb-3 animate-bounce">💩</div>
    <h1 class="text-4xl font-game text-cyan-400 mb-2">슬라임 똥피하기</h1>
    <p class="text-xs sm:text-sm text-slate-300 mb-6 max-w-xs leading-relaxed">
      하늘에서 떨어지는 장애물을 피하세요!<br>
      키보드 방향키 또는 화면 좌우를 터치해 조작합니다.
    </p>
    <button onclick="startGame()" class="btn-arcade bg-blue-600 hover:bg-blue-500 text-white font-game text-xl px-8 py-3 rounded-xl border border-blue-400">
      게임 시작
    </button>
  </div>

  <!-- 게임 오버 화면 -->
  <div id="gameOverScreen" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center z-20 hidden">
    <div class="text-5xl mb-2">💥</div>
    <h1 class="text-4xl font-game text-red-500 mb-2">GAME OVER</h1>
    <div class="bg-slate-800/80 border border-slate-700 rounded-xl p-4 w-full max-w-xs mb-6 space-y-2 font-game">
      <div class="flex justify-between text-slate-300">
        <span>피한 개수:</span>
        <span id="finalScore" class="text-cyan-400 text-lg">0</span>
      </div>
      <div class="flex justify-between text-slate-300">
        <span>최고 기록:</span>
        <span id="finalHighScore" class="text-yellow-400 text-lg">0</span>
      </div>
    </div>
    <button onclick="startGame()" class="btn-arcade bg-emerald-600 hover:bg-emerald-500 text-white font-game text-xl px-8 py-3 rounded-xl border border-emerald-400">
      다시 하기
    </button>
  </div>

  <!-- 모바일 터치 영역 -->
  <div class="absolute bottom-0 left-0 w-full h-32 flex z-10">
    <div id="btnLeft" class="flex-1 bg-transparent active:bg-blue-500/10 transition-colors"></div>
    <div id="btnRight" class="flex-1 bg-transparent active:bg-blue-500/10 transition-colors"></div>
  </div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // UI 요소를 가져옵니다.
  const startScreen = document.getElementById('startScreen');
  const gameOverScreen = document.getElementById('gameOverScreen');
  const scoreText = document.getElementById('scoreText');
  const highScoreText = document.getElementById('highScoreText');
  const finalScore = document.getElementById('finalScore');
  const finalHighScore = document.getElementById('finalHighScore');

  // 게임 변수
  let isPlaying = false;
  let score = 0;
  let highScore = parseInt(localStorage.getItem('dodge_slime_highscore') || '0');
  highScoreText.textContent = highScore;

  // 🔥 [핵심 해결책] 이모지를 Offscreen Canvas에 미리 그려 이미지로 캐싱
  const spriteCache = {};
  function createEmojiSprite(emoji, size = 36) {
    const offCanvas = document.createElement('canvas');
    offCanvas.width = size * 1.5;
    offCanvas.height = size * 1.5;
    const offCtx = offCanvas.getContext('2d');
    offCtx.font = `${size}px sans-serif`;
    offCtx.textAlign = 'center';
    offCtx.textBaseline = 'middle';
    offCtx.fillText(emoji, offCanvas.width / 2, offCanvas.height / 2);
    return offCanvas;
  }

  // 이모지 이미지 스프라이트 사전 생성
  spriteCache['poop'] = createEmojiSprite('💩', 32);
  spriteCache['rock'] = createEmojiSprite('🪨', 32);
  spriteCache['bomb'] = createEmojiSprite('💣', 32);

  // 캔버스 크기 재조정
  let width, height;
  function resize() {
    const rect = canvas.getBoundingClientRect();
    width = rect.width;
    height = rect.height;
    canvas.width = width;
    canvas.height = height;
  }
  window.addEventListener('resize', resize);
  resize();

  // 사운드 시스템 (Web Audio API)
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'dodge') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(350, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.06);
      gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.06);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.06);
    } else if (type === 'hit') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(160, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.25);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.25);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.25);
    }
  }

  // 키보드 조작
  const keys = { left: false, right: false };
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
  });

  // 모바일 터치 조작
  const btnLeft = document.getElementById('btnLeft');
  const btnRight = document.getElementById('btnRight');
  btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); keys.left = true; });
  btnLeft.addEventListener('touchend', (e) => { e.preventDefault(); keys.left = false; });
  btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); keys.right = true; });
  btnRight.addEventListener('touchend', (e) => { e.preventDefault(); keys.right = false; });

  // 슬라임 캐릭터 객체
  const player = {
    x: 0,
    y: 0,
    radius: 18,
    vx: 0,
    speed: 7,
    squishX: 1,
    squishY: 1,
    eyeOffset: 0,
    breath: 0,
    reset() {
      this.x = width / 2;
      this.y = height - 40;
      this.vx = 0;
      this.squishX = 1;
      this.squishY = 1;
    },
    update() {
      if (keys.left) {
        this.vx = -this.speed;
        this.eyeOffset = -4;
      } else if (keys.right) {
        this.vx = this.speed;
        this.eyeOffset = 4;
      } else {
        this.vx *= 0.75;
        this.eyeOffset *= 0.8;
      }

      this.x += this.vx;
      if (this.x < this.radius) this.x = this.radius;
      if (this.x > width - this.radius) this.x = width - this.radius;

      // 움직임에 따른 젤리 애니메이션 연출
      this.squishX = 1 + Math.sin(this.breath) * 0.05 + Math.abs(this.vx) * 0.025;
      this.squishY = 1 - Math.sin(this.breath) * 0.05 - Math.abs(this.vx) * 0.025;
      this.breath += 0.1;
    },
    draw() {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.scale(this.squishX, this.squishY);

      // 슬라임 본체
      ctx.fillStyle = '#06b6d4';
      ctx.beginPath();
      ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
      ctx.fill();

      // 슬라임 광택 하이라이트
      ctx.fillStyle = '#67e8f9';
      ctx.beginPath();
      ctx.arc(-this.radius * 0.3, -this.radius * 0.3, this.radius * 0.35, 0, Math.PI * 2);
      ctx.fill();

      // 외눈동자
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(this.eyeOffset, -2, 7, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(this.eyeOffset + (this.vx > 0 ? 1 : -1), -2, 3.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
  };

  // 장애물 배열 및 생성 로직
  let obstacles = [];
  let spawnTimer = 0;
  let spawnInterval = 28;

  function spawnObstacle() {
    const types = ['poop', 'rock', 'bomb'];
    const type = types[Math.floor(Math.random() * types.length)];
    const size = 32;
    obstacles.push({
      x: Math.random() * (width - size) + size / 2,
      y: -size,
      speed: 3.5 + Math.random() * 2.5 + Math.min(score * 0.04, 5),
      type: type,
      size: size
    });
  }

  // 파티클 효과
  let particles = [];
  function addParticles(x, y, color, count = 8) {
    for (let i = 0; i < count; i++) {
      if (particles.length > 50) particles.shift();
      particles.push({
        x: x,
        y: y,
        vx: (Math.random() - 0.5) * 6,
        vy: (Math.random() - 0.5) * 6,
        life: 1.0,
        color: color
      });
    }
  }

  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= 0.04;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function drawParticles() {
    particles.forEach(p => {
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.life;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1.0;
  }

  // 메인 게임 컨트롤
  function startGame() {
    score = 0;
    obstacles = [];
    particles = [];
    spawnInterval = 28;
    player.reset();
    isPlaying = true;
    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
    scoreText.textContent = '0';
  }

  function gameOver() {
    isPlaying = false;
    playSound('hit');
    addParticles(player.x, player.y, '#ef4444', 20);

    if (score > highScore) {
      highScore = score;
      localStorage.setItem('dodge_slime_highscore', highScore.toString());
      highScoreText.textContent = highScore;
    }

    finalScore.textContent = score;
    finalHighScore.textContent = highScore;
    gameOverScreen.classList.remove('hidden');
  }

  function update() {
    if (!isPlaying) return;

    player.update();

    // 장애물 생성 타이머
    spawnTimer++;
    if (spawnTimer >= Math.max(8, spawnInterval - Math.floor(score / 4))) {
      spawnObstacle();
      spawnTimer = 0;
    }

    // 장애물 이동 및 충돌 체크
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const obs = obstacles[i];
      obs.y += obs.speed;

      // 플레이어와 장애물 간 원형 충돌 판정
      const dx = player.x - obs.x;
      const dy = player.y - obs.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < player.radius + obs.size / 2 - 4) {
        gameOver();
        return;
      }

      // 🔥 화면 바닥을 완전히 통과했는지 체크하여 제거 (중간 삭제 현상 완전 회피)
      if (obs.y > height + obs.size) {
        obstacles.splice(i, 1);
        score++;
        scoreText.textContent = score;
        playSound('dodge');
      }
    }

    updateParticles();
  }

  function render() {
    ctx.clearRect(0, 0, width, height);

    // 은은한 네온 그리드 배경
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 1;
    for (let x = 0; x < width; x += 30) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, height);
      ctx.stroke();
    }
    for (let y = 0; y < height; y += 30) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(width, y);
      ctx.stroke();
    }

    // 🔥 오프스크린 캔버스에 캐싱된 이모지 이미지를 drawImage로 안정적 렌더링
    obstacles.forEach(obs => {
      const sprite = spriteCache[obs.type];
      if (sprite) {
        ctx.drawImage(sprite, obs.x - sprite.width / 2, obs.y - sprite.height / 2);
      }
    });

    drawParticles();

    if (isPlaying) {
      player.draw();
    }

    requestAnimationFrame(loop);
  }

  function loop() {
    update();
    render();
  }

  requestAnimationFrame(loop);
</script>
</body>
</html>
